spring.application.name=wellnara
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Localization: UI messages come from src/main/resources/messages*.properties.
# messages.properties is English (fallback); messages_ru.properties is Russian.
# System-locale fallback is off so a missing key falls back to the English base,
# never to the server's locale.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

wellnara.admin.username=${WELLNARA_ADMIN_USERNAME:admin}
wellnara.admin.email=${WELLNARA_ADMIN_EMAIL:admin@wellnara.local}
wellnara.admin.password=${WELLNARA_ADMIN_PASSWORD}
wellnara.invitation.ttl-days=7
wellnara.login.max-attempts=${WELLNARA_LOGIN_MAX_ATTEMPTS:5}
wellnara.login.lockout-minutes=${WELLNARA_LOGIN_LOCKOUT_MINUTES:15}