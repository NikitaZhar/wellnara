<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellnara — Client registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
    <style>
        .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        .auth-card { width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-md); overflow:hidden; }
        .auth-hero { height:120px; background:linear-gradient(135deg, #A6CBC9 0%, #BCD8D6 55%, #E4F0EC 100%); position:relative; }
        .auth-hero::after { content:""; position:absolute; right:-10px; top:-24px; width:170px; height:130px; background:radial-gradient(closest-side, rgba(243,233,214,.85), rgba(243,233,214,0)); }
        .auth-brand { position:absolute; left:24px; bottom:14px; display:flex; align-items:center; gap:10px; }
        .auth-brand .dot { width:24px; height:24px; border-radius:50%; background:var(--sea-primary); }
        .auth-brand .name { font-family:var(--font-display); font-size:20px; font-weight:500; color:var(--text); }
        .auth-body { padding:24px; }
        .auth-title { font-family:var(--font-display); font-size:26px; font-weight:500; margin:0 0 4px; }
        .auth-sub { margin:0 0 20px; font-size:14px; color:var(--text-muted); }
        .auth-body .btn { width:100%; margin-top:4px; }
        .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 var(--s-3); }

        @media (max-width:420px) {
            .auth-page { padding:16px; }
            .auth-hero { height:100px; }
            .auth-body { padding:20px; }
            .auth-title { font-size:23px; }
            .field-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-hero">
            <div class="auth-brand">
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Wellnara</span>
            </div>
        </div>

        <div class="auth-body">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-sub">Registering <span th:text="${email}">you@example.com</span></p>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}">Something went wrong.</span>
            </div>

            <form th:action="@{/client/register}" method="post">
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="field">
                    <label for="name">Login</label>
                    <input id="name" type="text" name="name" th:value="${name}" placeholder="Choose a login" required autofocus>
                </div>

                <div class="field-grid">
                    <div class="field">
                        <label for="firstName">First name</label>
                        <input id="firstName" type="text" name="firstName" th:value="${firstName}" required>
                    </div>
                    <div class="field">
                        <label for="lastName">Last name</label>
                        <input id="lastName" type="text" name="lastName" th:value="${lastName}" required>
                    </div>
                </div>

                <div class="field">
                    <label for="phone">Phone (optional)</label>
                    <input id="phone" type="tel" name="phone" th:value="${phone}"
                           autocomplete="tel" placeholder="+421904746337"
                           pattern="\+[1-9]\d{1,14}"
                           title="International format, e.g. +421904746337">
                    <span class="hint">International format, e.g. +421904746337</span>
                </div>

                <div class="field-grid">
                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" autocomplete="new-password" required>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Repeat password</label>
                        <input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
