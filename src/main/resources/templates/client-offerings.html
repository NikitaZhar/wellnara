<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellnara — Offerings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
</head>
<body>

<div th:replace="~{fragments/app-header :: header('Client')}"></div>
<div th:replace="~{fragments/client-nav :: nav('offerings')}"></div>

<main class="page">

    <div class="page-head">
        <div>
            <h1 class="page-title">Offerings</h1>
            <p class="page-sub">Your provider: <span style="color:var(--text); font-weight:500;" th:text="${providerName} ?: '—'">Provider</span></p>
        </div>
    </div>

    <section th:if="${not #lists.isEmpty(pendingPackages)}" style="margin-bottom:var(--s-6);">
        <div class="section-head">
            <h2>Package requests</h2>
        </div>
        <div class="list">
            <div class="item row-between" th:each="req : ${pendingPackages}">
                <div class="who">
                    <p class="primary" th:text="${req.offeringName}">Service</p>
                    <p class="secondary">
                        <span th:text="${req.sessions}">0</span> sessions ·
                        <span th:text="${req.price}">0.00</span> <span th:text="${req.currency}">EUR</span> reserved
                    </p>
                </div>
                <span class="badge badge-primary">Awaiting approval</span>
            </div>
        </div>
    </section>

    <section th:if="${not #lists.isEmpty(activePackages)}" style="margin-bottom:var(--s-6);">
        <div class="section-head">
            <h2>My packages</h2>
            <span class="count-pill" th:text="${#lists.size(activePackages)}">0</span>
        </div>
        <div class="list">
            <div class="item row-between" th:each="pkg : ${activePackages}">
                <div class="who">
                    <p class="primary" th:text="${pkg.offeringName}">Service</p>
                    <p class="secondary">
                        <span th:text="${pkg.remaining}">0</span> of <span th:text="${pkg.total}">0</span> left
                        <span th:if="${pkg.pending > 0}"> · <span th:text="${pkg.pending}">0</span> booked</span>
                    </p>
                </div>
                <a th:if="${pkg.canBookNext()}" class="btn btn-primary btn-sm"
                   th:href="@{/client/offerings/{offeringId}(offeringId=${pkg.offeringId})}">Book next</a>
                <span th:unless="${pkg.canBookNext()}" class="badge badge-primary">All booked</span>
            </div>
        </div>
    </section>

    <section>
        <div class="section-head">
            <h2>Available offerings</h2>
            <span class="count-pill" th:text="${#lists.size(offerings)}">0</span>
        </div>

        <div th:if="${#lists.isEmpty(offerings)}" class="empty">
            <p>No offerings available yet.</p>
        </div>

        <div class="list" th:if="${not #lists.isEmpty(offerings)}">
            <a class="list-row" style="text-decoration:none; color:inherit;"
               th:each="offering : ${offerings}"
               th:href="@{/client/offerings/{offeringId}(offeringId=${offering.id})}">
                <div class="who">
                    <p class="name" th:text="${offering.name}">Offering name</p>
                    <p class="email" th:text="${offering.description}">Description</p>
                </div>
                <span class="amount">
                    <span th:text="${offering.pricePerSession}">0.00</span>
                    <span th:text="${offering.currency}">EUR</span> ·
                    <span th:text="${offering.durationMinutes}">0</span> min
                </span>
                <span class="link-arrow" aria-hidden="true">→</span>
            </a>
        </div>
    </section>

</main>

</body>
</html>
