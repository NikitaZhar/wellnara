<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{creq.title}">Wellnara — Requests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
    <style>
        /* Action/notification rows (tokens only). */
        .appt { padding:14px 16px; border-bottom:1px solid var(--border); }
        .appt:last-child { border-bottom:none; }
        .appt-head { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
        .appt-title { font-size:15px; font-weight:500; color:var(--text); margin:0; }
        .appt-meta { font-size:13px; color:var(--text-muted); margin:2px 0 0; }
        .appt-actions { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin-top:10px; }
        .appt-actions form { margin:0; }
    </style>
</head>
<body>

<div th:replace="~{fragments/app-header :: header(#{role.client})}"></div>
<div th:replace="~{fragments/client-nav :: nav('requests')}"></div>

<main class="page">

    <div class="page-head">
        <div>
            <h1 class="page-title" th:text="#{creq.heading}">My requests</h1>
            <p class="page-sub"><span th:text="#{common.signedInAs}">Signed in as</span> <span th:text="${clientName}">Client</span></p>
        </div>
    </div>

    <!-- Everything still awaiting the provider: package requests and single-session
         appointment requests. Grouped by state, not by type. -->
    <section style="margin-bottom:var(--s-6);">
        <div class="section-head">
            <h2 th:text="#{creq.requests}">Requests</h2>
            <span class="count-pill"
                  th:text="${#lists.size(pendingPackages) + #lists.size(pendingAppointments)}">0</span>
        </div>

        <div th:if="${#lists.isEmpty(pendingPackages) and #lists.isEmpty(pendingAppointments)}" class="empty">
            <p th:text="#{creq.noPending}">No pending requests.</p>
        </div>

        <div class="list" th:if="${not #lists.isEmpty(pendingPackages) or not #lists.isEmpty(pendingAppointments)}">
            <!-- Package purchase requests (whole package held, awaiting approval). -->
            <div class="appt" th:each="req : ${pendingPackages}">
                <div class="appt-head">
                    <p class="appt-title" th:text="${req.offeringName}">Service</p>
                    <span class="badge badge-primary" th:text="#{chome.awaitingApproval}">Awaiting approval</span>
                </div>
                <p class="appt-meta">
                    <span th:text="#{creq.packagePrefix}">Package ·</span> <span th:text="${req.sessions}">0</span> <span th:text="#{home.sessions}">sessions</span> ·
                    <span th:text="${req.price}">0.00</span> <span th:text="${req.currency}">EUR</span> <span th:text="#{chome.reserved}">reserved</span>
                </p>
                <p class="appt-meta" th:if="${req.firstSessionStart != null}">
                    <span th:text="#{creq.firstSession}">First session:</span> <span th:text="${req.firstSessionStart.toLocalDate()}">Date</span>,
                    <span th:text="${req.firstSessionStart.toLocalTime()}">Time</span>
                </p>
                <div class="appt-actions">
                    <form th:action="@{/client/packages/{packageId}/cancel-request(packageId=${req.packageId})}"
                          method="post"
                          th:attr="data-confirm=#{creq.cancelPackage.confirm}">
                        <button type="submit" class="btn btn-secondary btn-sm" th:text="#{creq.cancelRequest}">Cancel request</button>
                    </form>
                </div>
            </div>

            <!-- Single-session appointment requests (may be a later package session). -->
            <div class="appt" th:each="appointment : ${pendingAppointments}">
                <div class="appt-head">
                    <p class="appt-title" th:text="${appointment.offeringName}">Offering</p>
                    <span class="badge badge-primary" th:text="#{chome.awaitingApproval}">Awaiting approval</span>
                </div>
                <p class="appt-meta">
                    <span th:text="${appointment.localDate}">Date</span>,
                    <span th:text="${appointment.localTime}">Time</span>
                </p>
                <p class="appt-meta" th:if="${packageLabels != null and packageLabels.containsKey(appointment.id)}"
                   th:text="${packageLabels.get(appointment.id)}">Session 3 of 10</p>
                <div class="appt-actions">
                    <form th:action="@{/client/appointments/{appointmentId}/cancel-request(appointmentId=${appointment.id})}"
                          method="post"
                          th:attr="data-confirm=#{creq.cancelAppt.confirm}">
                        <button type="submit" class="btn btn-secondary btn-sm" th:text="#{creq.cancelRequest}">Cancel request</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

</main>

</body>
</html>
