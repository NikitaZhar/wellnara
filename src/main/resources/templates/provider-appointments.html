<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellnara — Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
    <style>
        /* One-off layout for appointment rows (tokens only). */
        .appt { padding:14px 16px; border-bottom:1px solid var(--border); }
        .appt:last-child { border-bottom:none; }
        .appt-head { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
        .appt-title { font-size:15px; font-weight:500; color:var(--text); margin:0; }
        .appt-meta { font-size:13px; color:var(--text-muted); margin:2px 0 0; }
        .appt-actions { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin-top:10px; }
        .appt-actions form { margin:0; }
        /* Reason input revealed under the action row: full-width field, buttons below. */
        .reveal { margin-top:var(--s-3); }
        .reveal textarea {
            width:100%; font-family:var(--font-ui); font-size:14px; padding:8px 10px; resize:vertical;
            border:1px solid var(--border-strong); border-radius:var(--r-sm); background:var(--surface); color:var(--text);
        }
        .reveal textarea:focus { outline:none; border-color:var(--sea-primary); box-shadow:0 0 0 3px var(--sea-primary-tint); }
        .reveal-actions { display:flex; gap:var(--s-2); margin-top:var(--s-2); }
        .block-check { display:flex; align-items:center; gap:var(--s-2); font-size:14px; color:var(--text); margin-top:var(--s-3); cursor:pointer; }
        .block-check input { accent-color:var(--sea-primary); width:16px; height:16px; }
        /* Keep anchored sections clear of the sticky header when jumped to. */
        section[id] { scroll-margin-top:88px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/app-header :: header('Provider')}"></div>
<div th:replace="~{fragments/provider-nav :: nav('appointments')}"></div>

<main class="page">

    <div class="page-head">
        <div>
            <h1 class="page-title">Appointments</h1>
            <p class="page-sub">Signed in as <span th:text="${providerName}">Provider</span></p>
        </div>
    </div>

    <div th:if="${appointmentActionError}" class="alert alert-danger" role="alert">
        <p th:text="${appointmentActionError}" style="margin:0;"></p>
    </div>

    <section id="pending">
        <div class="section-head">
            <h2>Pending appointments</h2>
            <span class="count-pill" th:text="${#lists.size(appointments)}">0</span>
        </div>

        <div th:if="${#lists.isEmpty(appointments)}" class="empty">
            <p>No appointment requests.</p>
        </div>

        <div class="list" th:if="${not #lists.isEmpty(appointments)}">
            <div class="appt" th:each="appointment : ${appointments}">
                <div class="appt-head">
                    <p class="appt-title">
                        <span th:text="${appointment.clientName}">Client</span> ·
                        <span th:text="${appointment.offeringName}">Offering</span>
                    </p>
                    <span class="badge badge-primary" th:text="${appointment.status}">STATUS</span>
                </div>
                <p class="appt-meta">
                    <span th:text="${appointment.localDate}">Date</span>,
                    <span th:text="${appointment.localTime}">Time</span>
                </p>

                <div class="appt-actions">
                    <form th:action="@{/provider/appointments/{appointmentId}/accept(appointmentId=${appointment.id})}"
                          method="post"
                          onsubmit="return confirm('Accept this appointment request?');">
                        <button type="submit" class="btn btn-primary btn-sm">Accept</button>
                    </form>

                    <button type="button" class="btn btn-secondary btn-sm"
                            data-reveal th:attr="data-target='reject-' + ${appointment.id}">Reject</button>
                </div>

                <form class="reveal" style="display:none" th:id="'reject-' + ${appointment.id}"
                      th:action="@{/provider/appointments/{appointmentId}/reject(appointmentId=${appointment.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to reject this appointment request?');">
                    <textarea name="rejectionReason" placeholder="Reason for rejection" rows="2" required maxlength="1000"></textarea>
                    <div class="reveal-actions">
                        <button type="submit" class="btn btn-secondary btn-sm">Confirm reject</button>
                        <button type="button" class="btn btn-ghost btn-sm" data-hide th:attr="data-target='reject-' + ${appointment.id}">Back</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <section id="confirmed">
        <div class="section-head">
            <h2>Confirmed appointments</h2>
            <span class="count-pill" th:text="${#lists.size(confirmedAppointments)}">0</span>
        </div>

        <div th:if="${#lists.isEmpty(confirmedAppointments)}" class="empty">
            <p>No confirmed appointments.</p>
        </div>

        <div class="list" th:if="${not #lists.isEmpty(confirmedAppointments)}">
            <div class="appt" th:each="appointment : ${confirmedAppointments}">
                <div class="appt-head">
                    <p class="appt-title">
                        <span th:text="${appointment.clientName}">Client</span> ·
                        <span th:text="${appointment.offeringName}">Offering</span>
                    </p>
                    <span th:if="${appointment.status.name() == 'SCHEDULED' and appointment.completable}"
                          class="badge badge-warning">Needs outcome</span>
                    <span th:unless="${appointment.status.name() == 'SCHEDULED' and appointment.completable}"
                          class="badge badge-primary" th:text="${appointment.status}">STATUS</span>
                </div>
                <p class="appt-meta">
                    <span th:text="${appointment.localDate}">Date</span>,
                    <span th:text="${appointment.localTime}">Time</span>
                </p>
                <p class="appt-meta"
                   th:if="${appointment.status.name() == 'CANCELLED' and appointment.cancellationInitiator?.name() == 'CLIENT'}">
                    Appointment cancelled by client.
                </p>

                <div class="appt-actions" th:if="${appointment.status.name() == 'SCHEDULED'}">
                    <button type="button" class="btn btn-secondary btn-sm"
                            th:if="${!appointment.completable}"
                            data-reveal th:attr="data-target='cancel-' + ${appointment.id}">Cancel appointment</button>

                    <form th:if="${appointment.completable}"
                          th:action="@{/provider/appointments/{appointmentId}/complete(appointmentId=${appointment.id})}"
                          method="post"
                          onsubmit="return confirm('Mark this appointment as completed?');">
                        <button type="submit" class="btn btn-secondary btn-sm">Completed</button>
                    </form>

                    <form th:if="${appointment.completable}"
                          th:action="@{/provider/appointments/{appointmentId}/no-show(appointmentId=${appointment.id})}"
                          method="post"
                          onsubmit="return confirm('Mark this appointment as no-show?');">
                        <button type="submit" class="btn btn-secondary btn-sm">No-show</button>
                    </form>
                </div>

                <form class="reveal" style="display:none" th:if="${appointment.status.name() == 'SCHEDULED' and !appointment.completable}"
                      th:id="'cancel-' + ${appointment.id}"
                      th:action="@{/provider/appointments/{appointmentId}/cancel(appointmentId=${appointment.id})}"
                      method="post"
                      onsubmit="return confirm('Cancel this appointment?');">
                    <textarea name="providerMessage" placeholder="Message to the client (optional)" rows="2" maxlength="1000"></textarea>
                    <label class="block-check">
                        <input type="checkbox" name="blockSlot" value="true">
                        I'm no longer available at this time (block this slot)
                    </label>
                    <div class="reveal-actions">
                        <button type="submit" class="btn btn-secondary btn-sm">Confirm cancellation</button>
                        <button type="button" class="btn btn-ghost btn-sm" data-hide th:attr="data-target='cancel-' + ${appointment.id}">Back</button>
                    </div>
                </form>

                <div class="appt-actions"
                     th:if="${appointment.status.name() == 'CANCELLED' and appointment.cancellationInitiator?.name() == 'CLIENT'}">
                    <form th:action="@{/provider/appointments/{appointmentId}/acknowledge(appointmentId=${appointment.id})}"
                          method="post"
                          onsubmit="return confirm('Remove this appointment notification?');">
                        <button type="submit" class="btn btn-secondary btn-sm">OK</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

</main>

<script>
    document.querySelectorAll('[data-reveal]').forEach(function (button) {
        button.addEventListener('click', function () {
            const target = document.getElementById(button.getAttribute('data-target'));
            if (target) {
                target.style.display = 'block';
            }
            button.style.display = 'none';
        });
    });

    document.querySelectorAll('[data-hide]').forEach(function (button) {
        button.addEventListener('click', function () {
            const id = button.getAttribute('data-target');
            const target = document.getElementById(id);
            if (target) {
                target.style.display = 'none';
            }
            document.querySelectorAll('[data-reveal][data-target="' + id + '"]').forEach(function (toggle) {
                toggle.style.display = '';
            });
        });
    });
</script>

</body>
</html>
