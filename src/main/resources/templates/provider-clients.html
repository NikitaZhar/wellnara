<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{pcli.title}">Wellnara — Clients</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
</head>
<body>

<div th:replace="~{fragments/app-header :: header(#{role.provider})}"></div>
<div th:replace="~{fragments/provider-nav :: nav('clients')}"></div>

<main class="page">

    <div class="page-head">
        <div>
            <h1 class="page-title" th:text="#{pcli.heading}">My clients</h1>
            <p class="page-sub"><span th:text="#{common.signedInAs}">Signed in as</span> <span th:text="${providerName}">Provider</span></p>
        </div>
    </div>

    <section>
        <div class="section-head">
            <h2 th:text="#{pcli.invite}">Invite a client</h2>
        </div>

        <div class="card">
            <form th:action="@{/provider/invite-client}" method="post" class="inline-form">
                <div class="field">
                    <label for="clientEmail" th:text="#{pcli.clientEmail}">Client email</label>
                    <input id="clientEmail" type="email" name="email" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" th:text="#{pcli.inviteBtn}">Invite</button>
            </form>
        </div>

        <div th:if="${clientInviteError}" class="alert alert-danger" role="alert" style="margin-top:var(--s-3);">
            <p th:text="${clientInviteError}" style="margin:0;"></p>
        </div>

        <div th:if="${clientInviteSuccessMessage}" class="alert alert-success" role="status" style="margin-top:var(--s-3);">
            <p th:text="${clientInviteSuccessMessage}" style="margin:0;"></p>
        </div>
    </section>

    <section>
        <div class="section-head">
            <h2 th:text="#{pcli.clients}">Clients</h2>
            <span class="count-pill" th:text="${#lists.size(clients)}">0</span>
        </div>

        <div th:if="${#lists.isEmpty(clients)}" class="empty">
            <p th:text="#{pcli.noClients}">No clients yet. Invite your first client above.</p>
        </div>

        <div class="list" th:if="${not #lists.isEmpty(clients)}">
            <div class="list-row" th:each="clientRow : ${clients}">
                <span class="avatar" th:text="${clientRow.displayName == null or clientRow.displayName.isEmpty()
                        ? '?' : #strings.toUpperCase(#strings.substring(clientRow.displayName,0,1))}">C</span>

                <div class="who">
                    <p class="name" th:text="${clientRow.displayName}">Client name</p>
                    <p class="email">
                        <span th:text="${clientRow.email}">email</span>
                        <span th:if="${clientRow.phone}"> · <span th:text="${clientRow.phone}">phone</span></span>
                    </p>
                    <p class="email"><span th:text="#{pcli.invited}">Invited</span> <span th:text="${clientRow.invitedAt}">date</span></p>
                </div>

                <span class="amount">
                    <span th:text="${#numbers.formatDecimal(clientRow.availableBalance, 1, 2)}">0.00</span>
                    <span th:text="${clientRow.currency}">EUR</span>
                </span>

                <a class="btn btn-secondary btn-sm"
                   th:href="@{/provider/clients/{clientId}/wallet(clientId=${clientRow.clientId})}" th:text="#{pcli.wallet}">Wallet</a>

                <form th:action="@{/provider/clients/{clientId}/delete(clientId=${clientRow.clientId})}"
                      method="post"
                      th:attr="data-confirm=#{pcli.delete.confirm}">
                    <button type="submit" class="btn-icon" th:aria-label="#{pcli.deleteClient.aria}" aria-label="Delete client">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </section>

</main>

</body>
</html>
