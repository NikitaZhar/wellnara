<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellnara — Choose a new password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
    <style>
        .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        .auth-card {
            width:100%; max-width:400px; background:var(--surface);
            border:1px solid var(--border); border-radius:var(--r-lg);
            box-shadow:var(--sh-md); overflow:hidden;
        }
        .auth-hero { height:120px; background:linear-gradient(135deg, #A6CBC9 0%, #BCD8D6 55%, #E4F0EC 100%); position:relative; }
        .auth-hero::after {
            content:""; position:absolute; right:-10px; top:-24px; width:170px; height:130px;
            background:radial-gradient(closest-side, rgba(243,233,214,.85), rgba(243,233,214,0));
        }
        .auth-brand { position:absolute; left:24px; bottom:14px; display:flex; align-items:center; gap:10px; }
        .auth-brand .dot { width:24px; height:24px; border-radius:50%; background:var(--sea-primary); }
        .auth-brand .name { font-family:var(--font-display); font-size:20px; font-weight:500; color:var(--text); }
        .auth-body { padding:24px; }
        .auth-title { font-family:var(--font-display); font-size:26px; font-weight:500; margin:0 0 4px; }
        .auth-sub { margin:0 0 20px; font-size:14px; color:var(--text-muted); }
        .auth-body .btn { width:100%; margin-top:4px; }
        .auth-alt { margin:16px 0 0; font-size:14px; text-align:center; }
        .auth-alt a { color:var(--sea-primary-dark); text-decoration:none; }

        @media (max-width:420px) {
            .auth-page { padding:16px; }
            .auth-hero { height:100px; }
            .auth-body { padding:20px; }
            .auth-title { font-size:23px; }
        }
    </style>
</head>
<body>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-hero">
            <div class="auth-brand">
                <span class="dot" aria-hidden="true"></span>
                <span class="name">Wellnara</span>
            </div>
        </div>

        <div class="auth-body">
            <h1 class="auth-title">New password</h1>

            <div th:if="${tokenValid}">
                <p class="auth-sub">Choose a new password for your account.</p>

                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}">Password error.</span>
                </div>

                <form th:action="@{/auth/reset-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="field">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" type="password" name="newPassword" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
                    </div>

                    <div class="field">
                        <label for="confirmNewPassword">Confirm new password</label>
                        <input id="confirmNewPassword" type="password" name="confirmNewPassword" placeholder="Repeat your new password" autocomplete="new-password" required minlength="8">
                    </div>

                    <button type="submit" class="btn btn-primary">Set new password</button>
                </form>

                <p class="auth-alt"><a th:href="@{/auth/login}">Back to sign in</a></p>
            </div>

            <div th:unless="${tokenValid}">
                <p class="auth-sub">This reset link is invalid or has expired.</p>
                <p class="auth-alt"><a th:href="@{/auth/forgot-password}">Request a new link</a></p>
            </div>
        </div>
    </div>
</main>

</body>
</html>
