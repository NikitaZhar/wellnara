<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{creq.title}">Wellnara — Requests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
    <style>
        /* One-off layout for appointment rows (tokens only). */
        .appt { padding:14px 16px; border-bottom:1px solid var(--border); }
        .appt:last-child { border-bottom:none; }
        .appt-head { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; }
        .appt-title { font-size:15px; font-weight:500; color:var(--text); margin:0; }
        .appt-meta { font-size:13px; color:var(--text-muted); margin:2px 0 0; }
        .appt-actions { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin-top:10px; }
        .appt-actions form { margin:0; }
        /* Reason input revealed under the action row: full-width field, buttons below. */
        .reveal { margin-top:var(--s-3); }
        .reveal textarea {
            width:100%; font-family:var(--font-ui); font-size:14px; padding:8px 10px; resize:vertical;
            border:1px solid var(--border-strong); border-radius:var(--r-sm); background:var(--surface); color:var(--text);
        }
        .reveal textarea:focus { outline:none; border-color:var(--sea-primary); box-shadow:0 0 0 3px var(--sea-primary-tint); }
        .reveal-actions { display:flex; gap:var(--s-2); margin-top:var(--s-2); }
    </style>
</head>
<body>

<div th:replace="~{fragments/app-header :: header(#{role.provider})}"></div>
<div th:replace="~{fragments/provider-nav :: nav('requests')}"></div>

<main class="page">

    <div class="page-head">
        <div>
            <h1 class="page-title" th:text="#{creq.requests}">Requests</h1>
            <p class="page-sub"><span th:text="#{common.signedInAs}">Signed in as</span> <span th:text="${providerName}">Provider</span></p>
        </div>
    </div>

    <div th:if="${appointmentActionError}" class="alert alert-danger" role="alert">
        <p th:text="${appointmentActionError}" style="margin:0;"></p>
    </div>

    <div th:if="${packageError}" class="alert alert-danger" role="alert">
        <p th:text="${packageError}" style="margin:0;"></p>
    </div>

    <!-- Everything awaiting the provider's approval: package purchase requests and
         single-session appointment requests. Grouped by state, not by type. -->
    <section>
        <div class="section-head">
            <h2 th:text="#{creq.requests}">Requests</h2>
            <span class="count-pill"
                  th:text="${#lists.size(packageRequests) + #lists.size(appointments)}">0</span>
        </div>

        <div th:if="${#lists.isEmpty(packageRequests) and #lists.isEmpty(appointments)}" class="empty">
            <p th:text="#{creq.noPending}">No pending requests.</p>
        </div>

        <div class="list" th:if="${not #lists.isEmpty(packageRequests) or not #lists.isEmpty(appointments)}">
            <!-- Package purchase requests (Accept charges the hold; Reject releases it). -->
            <div class="appt" th:each="req : ${packageRequests}">
                <div class="appt-head">
                    <p class="appt-title">
                        <span th:text="${req.clientName}">Client</span> ·
                        <span th:text="#{phome.packagePrefix}">Package:</span> <span th:text="${req.offeringName}">Offering</span>
                    </p>
                    <span class="badge badge-primary" th:text="#{packageStatus.REQUESTED}">REQUESTED</span>
                </div>
                <p class="appt-meta">
                    <span th:text="${req.sessions}">0</span> <span th:text="#{home.sessions}">sessions</span> ·
                    <span th:text="${req.price}">0.00</span> <span th:text="${req.currency}">EUR</span>
                </p>
                <p class="appt-meta" th:if="${req.firstSessionStart != null}">
                    <span th:text="#{creq.firstSession}">First session:</span> <span th:text="${req.firstSessionStart.toLocalDate()}">2026-08-25</span>
                    <span th:text="#{common.at}">at</span> <span th:text="${req.firstSessionStart.toLocalTime()}">09:00</span>
                </p>
                <div class="appt-actions">
                    <form th:action="@{/provider/packages/{id}/accept(id=${req.packageId})}" method="post"
                          th:attr="data-confirm=#{preq.approvePackage.confirm}">
                        <button type="submit" class="btn btn-primary btn-sm" th:text="#{preq.accept}">Accept</button>
                    </form>
                    <form th:action="@{/provider/packages/{id}/reject(id=${req.packageId})}" method="post"
                          th:attr="data-confirm=#{preq.declinePackage.confirm}">
                        <button type="submit" class="btn btn-secondary btn-sm" th:text="#{preq.reject}">Reject</button>
                    </form>
                </div>
            </div>

            <!-- Single-session appointment requests. -->
            <div class="appt" th:each="appointment : ${appointments}">
                <div class="appt-head">
                    <p class="appt-title">
                        <span th:text="${appointment.clientName}">Client</span> ·
                        <span th:text="${appointment.offeringName}">Offering</span>
                    </p>
                    <span class="badge badge-primary" th:text="#{'appointmentStatus.__${appointment.status.name()}__'}">STATUS</span>
                </div>
                <p class="appt-meta">
                    <span th:text="${appointment.localDate}">Date</span>,
                    <span th:text="${appointment.localTime}">Time</span>
                </p>
                <p class="appt-meta" th:if="${packageLabels != null and packageLabels.containsKey(appointment.id)}"
                   th:text="${packageLabels.get(appointment.id)}">Session 3 of 10</p>

                <div class="appt-actions">
                    <form th:action="@{/provider/appointments/{appointmentId}/accept(appointmentId=${appointment.id})}"
                          method="post"
                          th:attr="data-confirm=#{preq.acceptAppt.confirm}">
                        <button type="submit" class="btn btn-primary btn-sm" th:text="#{preq.accept}">Accept</button>
                    </form>

                    <button type="button" class="btn btn-secondary btn-sm"
                            data-reveal th:attr="data-target='reject-' + ${appointment.id}" th:text="#{preq.reject}">Reject</button>
                </div>

                <form class="reveal" style="display:none" th:id="'reject-' + ${appointment.id}"
                      th:action="@{/provider/appointments/{appointmentId}/reject(appointmentId=${appointment.id})}"
                      method="post"
                      th:attr="data-confirm=#{preq.rejectAppt.confirm}">
                    <textarea name="rejectionReason" th:placeholder="#{preq.rejectionReason}" placeholder="Reason for rejection" rows="2" required maxlength="1000"></textarea>
                    <div class="reveal-actions">
                        <button type="submit" class="btn btn-secondary btn-sm" th:text="#{preq.confirmReject}">Confirm reject</button>
                        <button type="button" class="btn btn-ghost btn-sm" data-hide th:attr="data-target='reject-' + ${appointment.id}" th:text="#{pappt.back}">Back</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

</main>

<script>
    document.querySelectorAll('[data-reveal]').forEach(function (button) {
        button.addEventListener('click', function () {
            const target = document.getElementById(button.getAttribute('data-target'));
            if (target) {
                target.style.display = 'block';
            }
            button.style.display = 'none';
        });
    });

    document.querySelectorAll('[data-hide]').forEach(function (button) {
        button.addEventListener('click', function () {
            const id = button.getAttribute('data-target');
            const target = document.getElementById(id);
            if (target) {
                target.style.display = 'none';
            }
            document.querySelectorAll('[data-reveal][data-target="' + id + '"]').forEach(function (toggle) {
                toggle.style.display = '';
            });
        });
    });
</script>

</body>
</html>
