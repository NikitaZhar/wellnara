<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Client section navigation.
  Usage on any client page:
    <div th:replace="~{fragments/client-nav :: nav('offerings')}"></div>
  Pass the active section key: offerings | appointments | profile.
-->
<nav th:fragment="nav(active)" class="section-nav" th:aria-label="#{nav.aria.client}">
    <a th:href="@{/home}" class="section-nav-link section-nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/>
        </svg>
        <span th:text="#{nav.home}">Home</span>
    </a>

    <a th:href="@{/client/offerings}" class="section-nav-link"
       th:classappend="${active == 'offerings'} ? ' is-active'"
       th:attr="aria-current=${active == 'offerings'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82zM7 7h.01"/>
        </svg>
        <span th:text="#{nav.offerings}">Offerings</span>
    </a>

    <a th:href="@{/client/appointments}" class="section-nav-link"
       th:classappend="${active == 'appointments'} ? ' is-active'"
       th:attr="aria-current=${active == 'appointments'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h18v18H3zM16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span th:text="#{nav.upcoming}">Upcoming</span>
        <span th:if="${navNoticeCount != null and navNoticeCount > 0}" class="section-nav-badge alert"
              th:title="#{nav.notices}" th:text="${navNoticeCount}">1</span>
    </a>

    <a th:href="@{/client/requests}" class="section-nav-link"
       th:classappend="${active == 'requests'} ? ' is-active'"
       th:attr="aria-current=${active == 'requests'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span th:text="#{nav.requests}">Requests</span>
        <span th:if="${navPendingCount != null and navPendingCount > 0}" class="section-nav-badge count"
              th:title="#{nav.pending}" th:text="${navPendingCount}">2</span>
    </a>

    <a th:href="@{/client/wallet}" class="section-nav-link"
       th:classappend="${active == 'wallet'} ? ' is-active'"
       th:attr="aria-current=${active == 'wallet'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7h18v12H3zM3 7l2-3h12l2 3M16 13h2"/>
        </svg>
        <span th:text="#{nav.wallet}">Wallet</span>
    </a>

    <a th:href="@{/client/profile}" class="section-nav-link"
       th:classappend="${active == 'profile'} ? ' is-active'"
       th:attr="aria-current=${active == 'profile'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
        </svg>
        <span th:text="#{nav.profile}">Profile</span>
    </a>
</nav>

</body>
</html>
