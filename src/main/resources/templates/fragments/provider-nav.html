<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Provider section navigation.
  Usage on any provider page:
    <div th:replace="~{fragments/provider-nav :: nav('clients')}"></div>
  Pass the active section key: clients | offerings | appointments | availability | profile.
-->
<nav th:fragment="nav(active)" class="provider-nav" aria-label="Provider sections">
    <a th:href="@{/home}" class="provider-nav-link provider-nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/>
        </svg>
        Home
    </a>

    <a th:href="@{/provider/clients}" class="provider-nav-link"
       th:classappend="${active == 'clients'} ? ' is-active'"
       th:attr="aria-current=${active == 'clients'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Clients
    </a>

    <a th:href="@{/provider/offerings}" class="provider-nav-link"
       th:classappend="${active == 'offerings'} ? ' is-active'"
       th:attr="aria-current=${active == 'offerings'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L3 13V3h10l7.59 7.59a2 2 0 0 1 0 2.82zM7 7h.01"/>
        </svg>
        Offerings
    </a>

    <a th:href="@{/provider/appointments}" class="provider-nav-link"
       th:classappend="${active == 'appointments'} ? ' is-active'"
       th:attr="aria-current=${active == 'appointments'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h18v18H3zM16 2v4M8 2v4M3 10h18"/>
        </svg>
        Appointments
    </a>

    <a th:href="@{/provider/availability}" class="provider-nav-link"
       th:classappend="${active == 'availability'} ? ' is-active'"
       th:attr="aria-current=${active == 'availability'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
        Availability
    </a>

    <a th:href="@{/provider/profile}" class="provider-nav-link"
       th:classappend="${active == 'profile'} ? ' is-active'"
       th:attr="aria-current=${active == 'profile'} ? 'page' : null">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
        </svg>
        Profile
    </a>
</nav>

</body>
</html>
