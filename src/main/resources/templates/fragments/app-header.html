<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Reusable application header.
  Usage on any authenticated page:
    <div th:replace="~{fragments/app-header :: header('Admin')}"></div>
  Pass the current role label as the argument.

  The brand (logo + wordmark) links to /home, giving every authenticated screen a
  return to its role landing page. Provider pages also expose an explicit "Home"
  entry in the section navigation (fragments/provider-nav).
-->
<header th:fragment="header(role)" class="app-header">
    <a class="brand" th:href="@{/home}" th:aria-label="#{header.home.aria}">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="wordmark" th:text="#{app.name}">Wellnara</span>
    </a>
    <div class="app-header-right">
        <div th:replace="~{fragments/lang-switch :: switch}"></div>
        <span class="badge badge-primary" th:text="${role}">Role</span>
        <a th:href="@{/auth/logout}" class="btn btn-secondary btn-sm" th:text="#{header.logout}">Log out</a>
    </div>

    <!--
      Guard against accidental value changes: a focused <input type="number"> changes its
      value when the mouse wheel scrolls over it, which silently turned a 100 top-up into
      99.88 (12 wheel steps of 0.01). Blurring on wheel cancels that; the page still scrolls.
    -->
    <script>
        (function () {
            function guard() {
                document.querySelectorAll('input[type=number]').forEach(function (input) {
                    input.addEventListener('wheel', function () { this.blur(); });
                });
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', guard);
            } else {
                guard();
            }
        })();

        // Localized submit confirmation: a form carrying data-confirm asks before it submits.
        // The message is placed in the attribute (server-side, localized) instead of an inline
        // event handler, which Thymeleaf blocks for string expressions.
        (function () {
            document.addEventListener('submit', function (event) {
                var form = event.target;
                var message = form && form.getAttribute ? form.getAttribute('data-confirm') : null;
                if (message && !window.confirm(message)) {
                    event.preventDefault();
                }
            }, true);
        })();
    </script>
</header>

</body>
</html>
