<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.title}">Wellnara — Something went wrong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/sea-glass.css}" href="/css/sea-glass.css">
    <style>
        /* Standalone error screen — no app header (role is unknown here), mirrors the
           pre-auth shell of login.html. Screen-only layout on Sea Glass tokens. */
        .auth-page {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:var(--s-6);
        }
        .auth-card {
            width:100%;
            max-width:400px;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--r-lg);
            box-shadow:var(--sh-md);
            overflow:hidden;
        }
        .auth-hero {
            height:120px;
            background:linear-gradient(135deg, #A6CBC9 0%, #BCD8D6 55%, #E4F0EC 100%);
            position:relative;
        }
        .auth-hero::after {
            content:"";
            position:absolute;
            right:-10px; top:-24px;
            width:170px; height:130px;
            background:radial-gradient(closest-side, rgba(243,233,214,.85), rgba(243,233,214,0));
        }
        .auth-brand {
            position:absolute;
            left:var(--s-6); bottom:14px;
            display:flex; align-items:center; gap:10px;
        }
        .auth-brand .dot { width:24px; height:24px; border-radius:50%; background:var(--sea-primary); }
        .auth-brand .name { font-family:var(--font-display); font-size:20px; font-weight:500; color:var(--text); }
        .auth-body { padding:var(--s-6); }
        .err-code {
            display:inline-block;
            font-size:13px; font-weight:500;
            color:var(--text-muted);
            margin:0 0 var(--s-2);
        }
        .auth-title { font-family:var(--font-display); font-size:26px; font-weight:500; margin:0 0 4px; }
        .auth-sub { margin:0 0 var(--s-6); font-size:14px; color:var(--text-muted); }
        .err-actions { display:flex; flex-direction:column; gap:var(--s-2); }
        .err-actions .btn { width:100%; }

        @media (max-width:420px) {
            .auth-page { padding:var(--s-4); }
            .auth-hero { height:100px; }
            .auth-body { padding:var(--s-4); }
            .auth-title { font-size:23px; }
        }
    </style>
</head>
<body>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-hero">
            <div th:replace="~{fragments/lang-switch :: switch}"></div>
            <div class="auth-brand">
                <span class="dot" aria-hidden="true"></span>
                <span class="name" th:text="#{app.name}">Wellnara</span>
            </div>
        </div>

        <div class="auth-body">
            <span class="err-code"><span th:text="#{error.code}">Error</span> <span th:text="${statusCode}">500</span></span>
            <h1 class="auth-title" th:text="${statusReason} ?: #{error.heading}">Something went wrong</h1>
            <p class="auth-sub" th:if="${message}" th:text="${message}">Please try again in a moment.</p>

            <div class="err-actions">
                <a class="btn btn-primary" th:href="@{/home}" th:text="#{error.backHome}">Back to home</a>
                <a class="btn btn-ghost" th:href="@{/auth/login}" th:text="#{error.signIn}">Sign in</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
